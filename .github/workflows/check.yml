name: Check lists and modules

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check compares each list with the one before it.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/check.test.mjs tools/modules.test.mjs
      - run: node tools/check.mjs --previous HEAD~1
      # The module folders, the build's module list, the lock and the published list agree. No build, no Java.
      - run: node tools/modules.mjs check
